name: stylet
description: Cross-platform Flutter stylus input with pressure, tilt, buttons, barrel rotation, hover, double-tap, and squeeze support.
version: 0.1.1
homepage: https://github.com/focale-editor/stylet
repository: https://github.com/focale-editor/stylet

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  checks: ^0.3.1
  release: ^0.1.11

flutter:
  plugin:
    platforms:
      android:
        package: app.focaleeditor.stylet
        pluginClass: StyletPlugin
      ios:
        pluginClass: StyletPlugin
      linux:
        pluginClass: StyletPlugin
      macos:
        pluginClass: StyletPlugin
      web:
        pluginClass: StyletWeb
        fileName: stylet_web.dart
      windows:
        pluginClass: StyletPluginCApi
